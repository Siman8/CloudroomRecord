name: Build and release

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      release_version:
        description: Existing release version to rebuild and re-upload
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Check whether the app version changed
        id: version
        shell: pwsh
        run: |
          if ('${{ github.event_name }}' -eq 'workflow_dispatch') {
            $requested = '${{ inputs.release_version }}'
            if ($requested -notmatch '^\d+\.\d+\.\d+$') {
              throw "Invalid release version: $requested"
            }
            "changed=true" >> $env:GITHUB_OUTPUT
            "version=$requested" >> $env:GITHUB_OUTPUT
            "existing=true" >> $env:GITHUB_OUTPUT
            Write-Host "Rebuilding and re-uploading existing release v$requested."
            exit 0
          }

          $current = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          $previous = $null
          if ('${{ github.event.before }}' -match '^[0-9a-f]{40}$') {
            $previousJson = git show '${{ github.event.before }}:src-tauri/tauri.conf.json' 2>$null
            if ($LASTEXITCODE -eq 0) {
              $previous = ($previousJson -join "`n" | ConvertFrom-Json).version
            }
          }

          if ($current -notmatch '^\d+\.\d+\.\d+([-.][0-9A-Za-z.-]+)?$') {
            throw "Invalid application version: $current"
          }

          if ($current -eq $previous) {
            "changed=false" >> $env:GITHUB_OUTPUT
            "existing=false" >> $env:GITHUB_OUTPUT
            Write-Host "Version unchanged ($current); skipping release."
          } else {
            "changed=true" >> $env:GITHUB_OUTPUT
            "existing=false" >> $env:GITHUB_OUTPUT
            "version=$current" >> $env:GITHUB_OUTPUT
            Write-Host "Version changed from '$previous' to '$current'."
          }

      - name: Install frontend dependencies
        if: steps.version.outputs.changed == 'true'
        run: npm ci

      - name: Build Windows NSIS installer
        if: steps.version.outputs.changed == 'true'
        run: npm run build

      - name: Publish GitHub Release
        if: steps.version.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        shell: pwsh
        run: |
          $tag = "v$env:RELEASE_VERSION"
          $installer = Get-ChildItem 'src-tauri/target/release/bundle/nsis/*-setup.exe' | Select-Object -First 1
          if (-not $installer) {
            throw 'The NSIS installer was not produced.'
          }
          $assetName = "_$($env:RELEASE_VERSION)_x64-setup.exe"
          $assetLabel = "考勤记录_$($env:RELEASE_VERSION)_x64-setup.exe"
          $releaseInstaller = Join-Path $env:RUNNER_TEMP $assetName
          Copy-Item -LiteralPath $installer.FullName -Destination $releaseInstaller -Force

          $changelog = Get-Content CHANGELOG.md
          $start = ($changelog | Select-String -Pattern "^## \[$([regex]::Escape($env:RELEASE_VERSION))\]" | Select-Object -First 1).LineNumber
          if (-not $start) {
            throw "CHANGELOG.md does not contain a section for $env:RELEASE_VERSION"
          }
          $next = ($changelog | Select-String -Pattern '^## \[' | Where-Object { $_.LineNumber -gt $start } | Select-Object -First 1).LineNumber
          if ($next) {
            $notes = $changelog[($start - 1)..($next - 2)]
          } else {
            $notes = $changelog[($start - 1)..($changelog.Count - 1)]
          }
          $notesPath = Join-Path $env:RUNNER_TEMP "release-notes.md"
          $notes -join "`n" | Set-Content -Path $notesPath -Encoding utf8

          $digest = (Get-FileHash -Path $releaseInstaller -Algorithm SHA256).Hash.ToLowerInvariant()
          $manifest = @{
            version = $env:RELEASE_VERSION
            html_url = "https://github.com/${{ github.repository }}/releases/tag/$tag"
            asset_name = $assetName
            asset_label = $assetLabel
            download_url = "https://github.com/${{ github.repository }}/releases/download/$tag/$assetName"
            digest = "sha256:$digest"
            notes = ($notes -join "`n")
          } | ConvertTo-Json -Depth 4
          $manifestPath = Join-Path $env:RUNNER_TEMP "latest.json"
          [System.IO.File]::WriteAllText($manifestPath, $manifest, [System.Text.UTF8Encoding]::new($false))

          if ('${{ steps.version.outputs.existing }}' -eq 'true') {
            gh release upload $tag "$releaseInstaller#$assetLabel" --clobber
            gh release upload $tag $manifestPath --clobber
            gh release edit $tag --title "考勤记录 $tag" --notes-file $notesPath
          } else {
            gh release create $tag "$releaseInstaller#$assetLabel" `
              $manifestPath `
              --title "考勤记录 $tag" `
              --notes-file $notesPath
          }
